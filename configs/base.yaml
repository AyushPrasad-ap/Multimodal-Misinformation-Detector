project:
  name: multimodal-misinformation-detection
  seed: 42
  num_classes: 2
  labels:
    0: real
    1: fake

paths:
  data_root: data
  raw_dir: data/raw
  processed_dir: data/processed
  model_dir: models/checkpoints
  results_dir: results
  log_dir: logs

models:
  text:
    name: distilbert-base-uncased
    max_length: 128
    freeze: true

  image:
    name: resnet18
    image_size: 224
    freeze: true

  fusion:
    hidden_dim: 256
    dropout: 0.30

dataset:
  candidate_size:
    train: 14000
    validate: 2000
    test: 2000

  final_size:
    train: 12000
    validate: 1500
    test: 1500

  text_column: clean_title
  image_column: image_url
  label_column: 2_way_label
  id_column: id

  require_has_image: true
  require_valid_image: true

  split_priority:
    - test
    - validate
    - train

training:
  device: auto
  batch_size: 16
  epochs: 3
  learning_rate: 0.0001
  weight_decay: 0.0001
  num_workers: 0
  pin_memory: true
  mixed_precision: true

  optimizer:
    name: AdamW

evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1
    - roc_auc

  save_confusion_matrix: true
  save_roc_curve: true

image_download:
  timeout_seconds: 15
  max_retries: 2
  workers: 8
  jpeg_quality: 95